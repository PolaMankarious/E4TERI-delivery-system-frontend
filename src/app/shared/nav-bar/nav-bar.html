<header class="app-header">
  <div class="app-header-inner">
    <a class="brand-link" routerLink="/welcome" aria-label="Home">
      <img src="images\delivery-svgrepo-com.svg" alt="Logo" />
    </a>

    <nav class="app-nav">
      <a routerLink="/welcome" routerLinkActive="active">Home</a>
      @switch (userService.currentUser().role) {
      @case (Role.Business) {
      <a routerLink="/my-orders" routerLinkActive="active">My Orders</a>
      <a routerLink="/add-order" routerLinkActive="active">New Order</a>
      }
      @case (Role.Courier) {
      <a routerLink="/courier-orders" routerLinkActive="active">Assigned Orders</a>
      }
      @case (Role.Admin) {
      <a routerLink="/admin-orders" routerLinkActive="active">Manage Orders</a>
      <a routerLink="/assign-orders" routerLinkActive="active">Assign Orders</a>
      }
      }
      <span class="user-name"><em>{{ userService.currentUser().name }}</em></span>
      <button type="button" class="button button-secondary button-small" (click)="logout()">
        Logout
      </button>
    </nav>
  </div>
</header>
